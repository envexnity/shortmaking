<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Master Vault — Three.js r187 Studio Viewer</title>
  <style>
    :root { --bg: #0f1115; --panel: rgba(18, 21, 28, 0.86); --border: rgba(255,255,255,0.12); --accent: #ff6b35; --text: #eef1f6; --muted: #9aa3b2; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; top: 16px; left: 16px; display: flex; flex-direction: column; gap: 8px; background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 250px; z-index: 10; }
    #hud h1 { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
    #stats { font-family: "JetBrains Mono", monospace; font-size: 12px; color: var(--muted); line-height: 1.55; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    button, label.btn { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid var(--border); border-radius: 7px; padding: 6px 10px; font-size: 12px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
    button:hover, label.btn:hover { background: rgba(255,107,53,0.18); border-color: var(--accent); }
    button.active { background: var(--accent); color: #111; border-color: var(--accent); font-weight: 600; }
    #drop-hint { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px; font-size: 12px; color: var(--muted); pointer-events: none; }
    input[type="file"] { display: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">
    <h1>3D Master Studio · Three.js r187</h1>
    <div id="stats">Tris: — | Draw Calls: — | AgX</div>
    <div class="row">
      <label class="btn" for="glb-input">Load .GLB</label>
      <input id="glb-input" type="file" accept=".glb,.gltf" />
      <button id="btn-wire">Wireframe</button>
      <button id="btn-grid" class="active">Grid</button>
      <button id="btn-spin">Turntable</button>
      <button id="btn-shot">PNG Shot</button>
    </div>
  </div>
  <div id="drop-hint">Drag & drop any Blender 5.3 / TextureCraft .glb anywhere to inspect (AgX + RoomEnvironment)</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.AgXToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#12151c');

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.85;

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 200);
    camera.position.set(2.2, 1.5, 2.8);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.target.set(0, 0.5, 0);

    // Three-Point Calibrated Studio Rig (Matches Blender 5.3 Starter)
    const key = new THREE.DirectionalLight('#fff0dc', 2.4);
    key.position.set(3.5, 5.0, 3.2);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.bias = -0.0004;
    key.shadow.normalBias = 0.02;
    scene.add(key);

    const fill = new THREE.DirectionalLight('#bfd8ff', 0.85);
    fill.position.set(-4.0, 2.5, 2.0);
    scene.add(fill);

    const rim = new THREE.DirectionalLight('#e8f4ff', 1.6);
    rim.position.set(-2.5, 3.5, -4.0);
    scene.add(rim);

    // Shadow Catcher Floor + Grid
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.ShadowMaterial({ opacity: 0.35 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(10, 20, '#3a4252', '#232936');
    scene.add(grid);

    const assetRoot = new THREE.Group();
    scene.add(assetRoot);

    // Default Studio Calibration Shader Ball
    const demoMesh = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.45, 0.16, 180, 32),
      new THREE.MeshPhysicalMaterial({
        color: '#ff6b35',
        metalness: 0.15,
        roughness: 0.24,
        clearcoat: 0.8,
        clearcoatRoughness: 0.08,
        iridescence: 0.35,
      })
    );
    demoMesh.position.y = 0.72;
    demoMesh.castShadow = true;
    demoMesh.receiveShadow = true;
    assetRoot.add(demoMesh);

    const draco = new DRACOLoader();
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/libs/draco/gltf/');
    const loader = new GLTFLoader();
    loader.setDRACOLoader(draco);

    let mixer = null;
    let wireframe = false;
    let autoSpin = false;

    function clearAsset() {
      if (mixer) { mixer.stopAllAction(); mixer = null; }
      while (assetRoot.children.length) {
        const c = assetRoot.children.pop();
        c.traverse((n) => {
          if (n.geometry) n.geometry.dispose();
          if (n.material) {
            const mats = Array.isArray(n.material) ? n.material : [n.material];
            mats.forEach((m) => m.dispose());
          }
        });
      }
    }

    function frameObject(root) {
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      // Seat cleanly on Y = 0
      root.position.y -= box.min.y;
      root.position.x -= center.x;
      root.position.z -= center.z;
      const radius = Math.max(0.1, size.length() * 0.5);
      const dist = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov * 0.5)) * 1.15;
      controls.target.set(0, size.y * 0.48, 0);
      camera.position.set(dist * 0.62, size.y * 0.6 + dist * 0.28, dist * 0.72);
      controls.update();
    }

    function loadGLBUrl(url) {
      loader.load(url, (gltf) => {
        clearAsset();
        gltf.scene.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.material) o.material.wireframe = wireframe;
          }
        });
        assetRoot.add(gltf.scene);
        frameObject(gltf.scene);
        if (gltf.animations.length) {
          mixer = new THREE.AnimationMixer(gltf.scene);
          gltf.animations.forEach((clip) => mixer.clipAction(clip).play());
        }
      });
    }

    // Expose globals for threejs-devtools MCP & Playwright automation
    window.__THREE_STUDIO__ = { scene, camera, renderer, controls, assetRoot, loadGLBUrl };

    document.getElementById('glb-input').addEventListener('change', (e) => {
      const file = e.target.files?.[0];
      if (file) loadGLBUrl(URL.createObjectURL(file));
    });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer?.files?.[0];
      if (file) loadGLBUrl(URL.createObjectURL(file));
    });

    document.getElementById('btn-wire').addEventListener('click', (e) => {
      wireframe = !wireframe;
      e.target.classList.toggle('active', wireframe);
      assetRoot.traverse((o) => { if (o.isMesh && o.material) o.material.wireframe = wireframe; });
    });
    document.getElementById('btn-grid').addEventListener('click', (e) => {
      grid.visible = !grid.visible;
      e.target.classList.toggle('active', grid.visible);
    });
    document.getElementById('btn-spin').addEventListener('click', (e) => {
      autoSpin = !autoSpin;
      e.target.classList.toggle('active', autoSpin);
    });
    document.getElementById('btn-shot').addEventListener('click', () => {
      renderer.render(scene, camera);
      const a = document.createElement('a');
      a.download = 'threejs-studio-shot.png';
      a.href = renderer.domElement.toDataURL('image/png');
      a.click();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    const statsEl = document.getElementById('stats');
    function tick() {
      requestAnimationFrame(tick);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (mixer) mixer.update(dt);
      if (autoSpin) assetRoot.rotation.y += dt * 0.55;
      controls.update();
      renderer.render(scene, camera);
      const info = renderer.info.render;
      statsEl.textContent = `Tris: ${info.triangles.toLocaleString()} | Calls: ${info.calls} | AgX`;
    }
    tick();
  </script>
</body>
</html>
