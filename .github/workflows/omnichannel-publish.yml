name: Omnichannel Cloud Publisher

on:
  workflow_dispatch:
    inputs:
      package_id:
        description: "Manifest item ID to publish (leave blank for all)"
        required: false
        default: ""
      platforms:
        description: "Space-separated platforms (youtube tiktok instagram x)"
        required: false
        default: "youtube"
      dry_run:
        description: "Validate only without uploading"
        type: boolean
        default: false
  schedule:
    # Runs at 17:00 UTC on Nov 23 (00:00 UTC+7 on Nov 24) even when your PC is off
    - cron: "0 17 23 11 *"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install google-api-python-client google-auth-oauthlib boto3 tweepy

      - name: Run omnichannel publisher
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/omnichannel_publish.py --manifest scripts/omnichannel_manifest.json --id cb-20261123-1 --platforms tiktok instagram --tiktok-mode direct
          else
            ARGS="--manifest scripts/omnichannel_manifest.json --platforms ${{ inputs.platforms || 'youtube' }}"
            if [ -n "${{ inputs.package_id }}" ]; then
              ARGS="$ARGS --id ${{ inputs.package_id }}"
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS="$ARGS --dry-run"
            fi
            python scripts/omnichannel_publish.py $ARGS
          fi
